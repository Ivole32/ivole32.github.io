<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 - Page not found | Ivo Theis</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0f0f10" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
    <script>
    const path = window.location.pathname;
    const match = path.match(/^\/c\/([a-fA-F0-9]+)/);

    if (match) {
        const commitId = match[1];
        const target = "https://github.com/Ivole32/Linux-API/commit/" + commitId;
        location.replace(target);
    }
    </script>
</head>
<body>
    <main id="main" class="page-main">
        <div class="container page-card">
            <h1>404 - Page not found</h1>
            <p>The requested page does not exist or has been moved.</p>
            <a class="card-link" href="/">Back to the homepage</a>
        </div>
    </main>
</body>
</html>
