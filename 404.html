<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>404 - Not found</title>
    <script>
    const path = window.location.pathname;
    const match = path.match(/^\/c\/([a-fA-F0-9]+)/);

    if (match) {
        const commitId = match[1];
        const target = "https://github.com/Ivole32/Linux-API/commit/" + commitId;
        location.replace(target);
    }
    </script>
</head>
<body>
    <h1>404 - Page not found</h1>
    <p>The requested page does not exist...</p>
</body>
</html>
